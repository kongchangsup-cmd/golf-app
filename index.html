<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<meta name="theme-color" content="#185FA5"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-title" content="골프정산"/>
<title>골프 정산</title>
<style>
:root{
  --bg:#f8f9fa;--card:#fff;--border:#e2e8f0;--border2:#cbd5e1;
  --txt:#1e293b;--txt2:#64748b;--txt3:#94a3b8;
  --blue:#185FA5;--blue-bg:#E6F1FB;--blue-txt:#0C447C;
  --green:#3B6D11;--green-bg:#EAF3DE;--green-txt:#27500A;
  --red:#A32D2D;--amber-bg:#FAEEDA;--amber-txt:#633806;
  --purple-bg:#EEEDFE;--purple-txt:#3C3489;
  --teal-bg:#E1F5EE;--teal-txt:#085041;
  --radius:12px;--radius-sm:8px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,'Noto Sans KR',sans-serif;color:var(--txt);font-size:16px;}
body{overflow-x:hidden;}
.app{max-width:480px;margin:0 auto;padding:0 0 40px;}
.topbar{background:var(--blue);color:#fff;padding:14px 16px 12px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:10;}
.topbar-title{font-size:17px;font-weight:600;}
.topbar-sub{font-size:13px;opacity:.8;margin-left:auto;}
.page{display:none;padding:8px 12px;}.page.active{display:block;}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:10px 14px;margin-bottom:8px;}
.sec{font-size:11px;color:var(--txt2);font-weight:600;margin-bottom:6px;letter-spacing:.06em;text-transform:uppercase;}
.frow{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--border);}
.frow:last-child{border-bottom:none;}
.flabel{font-size:15px;color:var(--txt);}
.fsub{font-size:12px;color:var(--txt3);margin-top:2px;}
.finput{font-size:14px;text-align:right;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);padding:5px 8px;color:var(--txt);}
.finput:focus{outline:none;border-color:var(--blue);}
.nrow{display:flex;align-items:center;gap:10px;}
.nbtn{width:30px;height:30px;border-radius:50%;border:1px solid var(--border2);background:var(--card);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--txt);line-height:1;}
.nbtn:active{background:var(--bg);}
.nval{font-size:14px;font-weight:600;min-width:52px;text-align:center;color:var(--txt);}
.ibox{background:var(--blue-bg);border-radius:var(--radius-sm);padding:7px 12px;font-size:12px;color:var(--blue-txt);margin-bottom:8px;line-height:1.5;}
.btn-full{width:100%;padding:12px;font-size:15px;font-weight:700;border-radius:var(--radius);border:none;cursor:pointer;background:var(--blue);color:#fff;letter-spacing:.02em;font-family:inherit;}
.btn-full:active{background:var(--blue-txt);}
.btnsm{font-size:13px;padding:8px 14px;border-radius:var(--radius-sm);cursor:pointer;border:1px solid var(--border2);background:var(--card);color:var(--txt);font-weight:500;font-family:inherit;}
.btnsm:active{background:var(--bg);}
.btnsmp{background:var(--blue);color:#fff;border-color:var(--blue);font-weight:600;}
.btnsmp:active{background:var(--blue-txt);}
.brow{display:flex;gap:8px;flex-wrap:wrap;padding:0 14px;}
.pmode-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:0;}
.pmode-btn{padding:10px 10px;border-radius:var(--radius);border:2px solid var(--border);background:var(--card);cursor:pointer;text-align:center;width:100%;font-family:inherit;}
.pmode-btn.active{border-color:var(--blue);background:var(--blue-bg);}
.pmode-btn:active{transform:scale(.97);}
.pmode-num{font-size:22px;font-weight:700;color:var(--txt2);}
.pmode-btn.active .pmode-num{color:var(--blue-txt);}
.pmode-label{font-size:12px;color:var(--txt2);margin-top:1px;}
.pmode-btn.active .pmode-label{color:var(--blue-txt);}
.prow{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--border);}
.prow:last-child{border-bottom:none;}
.pavt{display:inline-flex;width:24px;height:24px;border-radius:50%;font-size:10px;font-weight:700;align-items:center;justify-content:center;flex-shrink:0;}
.gas-btn{width:32px;height:32px;border-radius:50%;border:1.5px solid var(--border2);background:var(--bg);font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-family:inherit;}
.gas-btn:active{transform:scale(.92);}
.gas-btn.on{background:var(--blue-bg);border-color:var(--blue);}
.player-section{margin-bottom:12px;}
.player-header{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.pname{font-size:15px;font-weight:700;color:var(--txt);}
.score-btn-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;}
.scbtn{padding:5px 2px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--bg);cursor:pointer;text-align:center;line-height:1.3;font-family:inherit;}
.scbtn:active{transform:scale(.95);}
.scbtn-name{font-size:12px;font-weight:600;color:var(--txt2);}
.scbtn-val{font-size:10px;display:block;margin-top:1px;color:var(--txt3);}
.sel-eag{background:var(--blue-bg);border-color:var(--blue);}.sel-eag .scbtn-name{color:var(--blue-txt);}.sel-eag .scbtn-val{color:var(--blue);}
.sel-bir{background:var(--green-bg);border-color:var(--green);}.sel-bir .scbtn-name{color:var(--green-txt);}.sel-bir .scbtn-val{color:var(--green);}
.sel-par{background:#F1EFE8;border-color:#5F5E5A;}.sel-par .scbtn-name{color:#444441;}.sel-par .scbtn-val{color:#5F5E5A;}
.sel-bog{background:var(--amber-bg);border-color:#854F0B;}.sel-bog .scbtn-name{color:var(--amber-txt);}.sel-bog .scbtn-val{color:#854F0B;}
.sel-dbl{background:#FAECE7;border-color:#993C1D;}.sel-dbl .scbtn-name{color:#712B13;}.sel-dbl .scbtn-val{color:#993C1D;}
.sel-tri{background:#FCEBEB;border-color:var(--red);}.sel-tri .scbtn-name{color:#791F1F;}.sel-tri .scbtn-val{color:var(--red);}
.sel-qua{background:#FCEBEB;border-color:#791F1F;}.sel-qua .scbtn-name{color:#501313;}.sel-qua .scbtn-val{color:#791F1F;}
.sel-fiv{background:#FCEBEB;border-color:#501313;}.sel-fiv .scbtn-name{color:#501313;}.sel-fiv .scbtn-val{color:#501313;}
.sdisplay{display:flex;align-items:stretch;background:var(--bg);border-radius:var(--radius-sm);border:1px solid var(--border);overflow:hidden;margin-bottom:6px;}
.sdcol{flex:1;padding:8px 4px;text-align:center;border-right:1px solid var(--border);}
.sdcol:last-child{border-right:none;}
.verdict-box{text-align:center;padding:6px 0 2px;min-height:32px;}
.badge{display:inline-block;font-size:12px;padding:4px 8px;border-radius:99px;font-weight:600;margin:2px;}
.bw{background:var(--green-bg);color:var(--green-txt);}
.bd{background:#F1EFE8;color:#444441;}
.b2{background:var(--amber-bg);color:var(--amber-txt);}
.b3{background:#FCEBEB;color:#791F1F;}
.hnav{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
.htitle{font-size:17px;font-weight:700;color:var(--txt);}
.divider{height:1px;background:var(--border);margin:4px 0 12px;}
.team-win-score{border:2px solid #d43b3b!important;border-radius:7px;padding:2px 5px!important;}
.team-lose-score{border:2px solid #2874c7!important;border-radius:7px;padding:2px 5px!important;}
.team-tie-score{border:2px solid #94a3b8!important;border-radius:7px;padding:2px 5px!important;}
.score-table{width:100%;border-collapse:collapse;font-size:12px;table-layout:fixed;}
.score-table th{font-size:11px;color:var(--txt2);font-weight:600;padding:6px 3px;text-align:center;border-bottom:1px solid var(--border);background:var(--bg);}
.score-table th:first-child{text-align:left;padding-left:0;width:36px;}
.score-table td{padding:5px 3px;text-align:center;border-bottom:1px solid var(--border);}
.score-table td:first-child{text-align:left;padding-left:0;font-size:11px;}
.score-table tr:last-child td{border-bottom:none;}
.cur-row td{background:#f0f7ff;}
.sum-row td{background:var(--bg);border-bottom:2px solid var(--border2)!important;font-weight:600;}
.sc-chip{display:inline-block;font-size:11px;padding:2px 5px;border-radius:99px;font-weight:600;}
.chip-neg2{background:var(--blue-bg);color:var(--blue-txt);}
.chip-neg1{background:var(--green-bg);color:var(--green-txt);}
.chip-0{background:#F1EFE8;color:#444441;}
.chip-1{background:var(--amber-bg);color:var(--amber-txt);}
.chip-2{background:#FAECE7;color:#712B13;}
.chip-pos{background:#FCEBEB;color:#791F1F;}
.rank1{background:var(--green-bg);color:var(--green-txt);font-size:10px;padding:1px 4px;border-radius:99px;font-weight:700;display:inline-block;}
.rank2{background:var(--amber-bg);color:var(--amber-txt);font-size:10px;padding:1px 4px;border-radius:99px;font-weight:700;display:inline-block;}
.rank3{background:#FCEBEB;color:#791F1F;font-size:10px;padding:1px 4px;border-radius:99px;font-weight:700;display:inline-block;}
.rrow{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);}
.rrow:last-child{border-bottom:none;}
.sgrid{display:grid;gap:8px;margin-bottom:12px;padding:0 14px;}
.sgrid-2{grid-template-columns:1fr 1fr;}
.sgrid-3{grid-template-columns:1fr 1fr 1fr;}
.met{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px 10px;}
.mlabel{font-size:11px;color:var(--txt2);margin-bottom:3px;font-weight:500;}
.mval{font-size:20px;font-weight:700;}
.msub{font-size:11px;color:var(--txt3);margin-top:2px;}
.hrow{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--border);font-size:13px;}
.hrow:last-child{border-bottom:none;}
.crow{display:flex;justify-content:space-between;font-size:13px;padding:3px 0;color:var(--txt2);}
.crow.tot{font-size:14px;font-weight:700;color:var(--txt);padding-top:6px;border-top:1px solid var(--border);margin-top:5px;}
.cstep{padding:9px 0;border-bottom:1px solid var(--border);}
.cstep:last-child{border-bottom:none;}
.cstep-title{font-size:12px;color:var(--txt2);margin-bottom:7px;font-weight:600;}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <span class="topbar-title">⛳ 골프 정산</span>
    <span class="topbar-sub" id="topbar-sub">설정</span>
  </div>

  <!-- PAGE 1: 설정 -->
  <div id="pg-setup" class="page active">
    <div class="card" style="margin-top:8px;">
      <div class="sec" style="margin-bottom:6px;">인원 선택</div>
      <div class="pmode-grid">
        <button class="pmode-btn active" id="mode2btn" onclick="setMode(2)" type="button">
          <div class="pmode-num">2인</div>
          <div class="pmode-label">1 vs 1</div>
        </button>
        <button class="pmode-btn" id="mode3btn" onclick="setMode(3)" type="button">
          <div class="pmode-num">3인</div>
          <div class="pmode-label">1 vs 1 vs 1</div>
        </button>
        <button class="pmode-btn" id="mode4btn" onclick="setMode(4)" type="button"><div class="pmode-num">4인</div><div class="pmode-label">랜덤 2 vs 2</div></button>
        <button class="pmode-btn" id="mode4singlebtn" onclick="alert('4인 개인전은 추후 개발 예정입니다.')" type="button"><div class="pmode-num">4인 개인전</div><div class="pmode-label">준비 중</div></button>
      </div>
    </div>
    <div class="card">
      <div class="sec">플레이어</div>
      <div id="gasfee-hint" style="display:none;font-size:12px;padding:6px 10px;background:var(--blue-bg);border-radius:var(--radius-sm);color:var(--blue-txt);margin-bottom:6px;">⛽ 멀리서 오는 플레이어 이름 옆 버튼을 눌러 기름값 체크</div>
      <div class="prow">
        <span class="pavt" style="background:var(--blue-bg);color:var(--blue-txt);">P1</span>
        <input class="finput" id="p1name" type="text" value="공창섭" maxlength="8" style="flex:1;width:auto;"/>
        <button id="gascheck0" class="gas-btn" onclick="toggleGas(0)" type="button" style="display:none;">⛽</button>
      </div>
      <div class="prow">
        <span class="pavt" style="background:var(--purple-bg);color:var(--purple-txt);">P2</span>
        <input class="finput" id="p2name" type="text" value="이태석" maxlength="8" style="flex:1;width:auto;"/>
        <button id="gascheck1" class="gas-btn" onclick="toggleGas(1)" type="button" style="display:none;">⛽</button>
      </div>
      <div class="prow" id="p3row" style="display:none;">
        <span class="pavt" style="background:var(--teal-bg);color:var(--teal-txt);">P3</span>
        <input class="finput" id="p3name" type="text" value="이태석" maxlength="8" style="flex:1;width:auto;"/>
        <button id="gascheck2" class="gas-btn" onclick="toggleGas(2)" type="button" style="display:none;">⛽</button>
      </div>
      <div class="prow" id="p4row" style="display:none;"><span class="pavt" style="background:#FAEEDA;color:#633806;">P4</span><input class="finput" id="p4name" type="text" value="플레이어4" maxlength="8" style="flex:1;width:auto;"/></div>
    </div>
    <div class="card">
      <div class="sec">게임 설정</div>


      <div class="frow">
        <div><div class="flabel">인당 게임비</div><div class="fsub">게임장 이용 비용</div></div>
        <input class="finput" id="gf" type="number" value="15000" min="0" step="1000" style="width:130px;"/>
      </div>
      <div class="frow" id="teamfee-row" style="display:none"><div><div class="flabel">4인 팀전 홀별 비용</div><div class="fsub">패배팀 1인당 기본 비용</div></div><input class="finput" id="teamfee" type="number" value="1000" min="0" step="1000" style="width:130px;"/></div>
      <div class="frow">
        <div><div class="flabel">멀리건 비용 적용</div><div class="fsub">2회 +1,000원 / 3회 +2,000원</div></div>
        <button id="mulligan-toggle" onclick="toggleMulligan()" type="button" style="width:52px;height:30px;border-radius:99px;border:none;cursor:pointer;font-size:13px;font-weight:600;font-family:inherit;background:#94a3b8;color:#fff;transition:background .2s;">OFF</button>
      </div>
    </div>
    <div class="ibox" id="ibox"></div>
    <button class="btn-full" onclick="startGame()" type="button">게임 시작</button>
  </div>

  <!-- PAGE 2: 스코어 입력 -->
  <div id="pg-score" class="page">
    <div style="height:12px;"></div>
    <div class="card">
      <div class="hnav">
        <button class="btnsm" onclick="prevH()" type="button">← 이전</button>
        <span class="htitle" id="htitle">홀 1</span>
        <button class="btnsm" onclick="nextH()" type="button">다음 →</button>
      </div>
      <div id="score-inputs"></div>
      <div id="team-draw-area" style="display:none;margin:10px 0;"></div>
      <div class="sdisplay" id="sdisplay"></div>
      <div class="verdict-box" id="verd"></div>
    </div>
    <div class="card">
      <div class="sec">성적 기록</div>
      <div style="overflow-x:auto;" id="scoretable"></div>
    </div>
    <div class="card">
      <div class="sec">누적 현황</div>
      <div id="rtotal"></div>
    </div>
    <div class="brow">
      <button class="btnsm" onclick="showP('pg-setup')" type="button">← 설정</button>
      <button class="btnsm btnsmp" onclick="goResult()" type="button">최종 정산 →</button>
    </div>
  </div>

  <!-- PAGE 3: 정산 결과 -->
  <div id="pg-result" class="page">
    <div style="height:12px;"></div>
    <div class="sgrid sgrid-2" id="scards"></div>
    <div class="card" style="margin:0 14px 12px;">
      <div class="sec">정산 계산 과정</div>
      <div id="cbdown"></div>
    </div>
    <div class="card" style="margin:0 14px 12px;">
      <div class="sec">홀별 내역</div>
      <div id="hbdown"></div>
    </div>
    <div class="brow">
      <button class="btnsm" onclick="showP('pg-score')" type="button">← 스코어</button>
      <button class="btnsm" onclick="resetGame()" type="button">새 게임</button>
    </div>
  </div>
</div>

<script>
const LV=[
  {label:'이글',val:-2,cls:'sel-eag',short:'이글'},
  {label:'버디',val:-1,cls:'sel-bir',short:'버디'},
  {label:'파',val:0,cls:'sel-par',short:'파'},
  {label:'보기',val:1,cls:'sel-bog',short:'보기'},
  {label:'더블',val:2,cls:'sel-dbl',short:'더블'},
  {label:'트리플',val:3,cls:'sel-tri',short:'트리플'},
  {label:'쿼드',val:4,cls:'sel-qua',short:'쿼드'},
  {label:'5오버',val:5,cls:'sel-fiv',short:'5오버'},
];
const AV_STYLE=[
  'background:var(--blue-bg);color:var(--blue-txt);',
  'background:var(--purple-bg);color:var(--purple-txt);',
  'background:var(--teal-bg);color:var(--teal-txt);',
  'background:var(--amber-bg);color:var(--amber-txt);',
];

function dv(v){return v===0?'E':(v>0?'+'+v:String(v));}
function ls(v){let l=LV.find(x=>x.val===v);return l?l.short:(v>5?'+'+v:dv(v));}
function cc(v){if(v===null)return '';if(v<=-2)return 'chip-neg2';if(v===-1)return 'chip-neg1';if(v===0)return 'chip-0';if(v===1)return 'chip-1';if(v===2)return 'chip-2';return 'chip-pos';}
function vc(v){if(v===null)return '#94a3b8';if(v<=-2)return '#0C447C';if(v===-1)return '#27500A';if(v===0)return '#444441';if(v<=2)return '#854F0B';return '#A32D2D';}
function sc(v){return v<0?'#27500A':v===0?'#444441':'#A32D2D';}
function r1k(v){return Math.round(v/1000)*1000;}

let G={mode:2,h:18,u:1000,gf:15000,cur:0,sc:[],nm:['공창섭','이태석','이태석','플레이어4'],teamFee:1000,draws:[],gasFee:-1,useMulligan:false,mg:[]};

function initSc(){
  G.sc=Array.from({length:G.h},()=>Array(G.mode).fill(null));
  G.mg=Array(G.mode).fill(0);
  G.draws=Array(G.h).fill(null);
}

function toggleMulligan(){
  G.useMulligan=!G.useMulligan;
  let btn=document.getElementById('mulligan-toggle');
  if(btn){
    btn.textContent=G.useMulligan?'ON':'OFF';
    btn.style.background=G.useMulligan?'var(--blue)':'#94a3b8';
  }
}

function setMode(m){
  G.mode=m;
  G.gasFee=-1;
  document.getElementById('mode2btn').classList.toggle('active',m===2);
  document.getElementById('mode3btn').classList.toggle('active',m===3);
  document.getElementById('mode4btn').classList.toggle('active',m===4);
  document.getElementById('p4row').style.display=m===4?'flex':'none';
  document.getElementById('teamfee-row').style.display=m===4?'flex':'none';
  document.getElementById('p3row').style.display=m>=3?'flex':'none';
  document.getElementById('gasfee-hint').style.display=m===3?'block':'none';
  let p2=document.getElementById('p2name');
  if(m===2&&p2.value==='') p2.value='이태석';
  if(m===3&&p2.value==='이태석') p2.value='';

  for(let p=0;p<3;p++){
    let el=document.getElementById('gascheck'+p);
    if(el) el.style.display=m===3?'flex':'none';
  }
  updateGasUI();
  updI();
}

function toggleGas(i){
  G.gasFee=(G.gasFee===i)?-1:i;
  updateGasUI();
}

function updateGasUI(){
  for(let p=0;p<3;p++){
    let el=document.getElementById('gascheck'+p);
    if(!el) continue;
    if(G.gasFee===p){
      el.classList.add('on');
      el.textContent='✓';
    } else {
      el.classList.remove('on');
      el.textContent='⛽';
    }
  }
}

function updI(){
  document.getElementById('ibox').textContent=G.mode===4?'4인 랜덤 2:2 팀전 · 점수 입력 후 팀 뽑기 · 동점 배율 이월 · 버디 -1,000원 / 이글 -3,000원 · 1인 최대 30,000원':G.mode===2

/* ── 홀별 금액 계산 ── */
function holeAmounts(row){
  if(row.some(v=>v===null)) return null;
  if(G.mode===2){
    let [a,b]=row;
    if(a===b) return [G.u,G.u];       // 비김: 각 1,000원
    return a<b?[0,G.u*2]:[G.u*2,0];  // 이김: 0원, 짐: 2,000원
  }
  if(G.mode===4) return teamHoleAmounts(G.sc.indexOf(row));
  // 3인: 전원동타=각u, 공동1등2명=0/0/2u, 1등1명공동2등=0/u/u, 1/2/3등=0/u/2u
  let [a,b,c]=row;
  if(a===b&&b===c) return [G.u,G.u,G.u];
  let mn=Math.min(a,b,c),mx=Math.max(a,b,c);
  if(row.filter(v=>v===mn).length===2) return row.map(v=>v===mn?0:G.u*2);
  if(row.filter(v=>v===mx).length===2) return row.map(v=>v===mx?G.u:0);
  let sorted=[...row].sort((x,y)=>x-y);
  return row.map(v=>sorted.indexOf(v)*G.u);
}


/* 4인 팀전: 각 홀 점수 입력 후 팀 추첨, 동점은 다음 홀로 배율 이월 */
function teamHoleAmounts(i){
  if(i<0||!G.draws?.[i]||G.sc[i].some(v=>v===null))return null;
  let a=G.draws[i].a,b=[0,1,2,3].filter(p=>!a.includes(p));
  let sa=a.reduce((x,p)=>x+G.sc[i][p],0),sb=b.reduce((x,p)=>x+G.sc[i][p],0);
  if(sa===sb)return [0,0,0,0];
  let mult=1;
  for(let j=i-1;j>=0;j--){if(!G.draws[j]||G.sc[j].some(v=>v===null))break;
    let x=G.draws[j].a,y=[0,1,2,3].filter(p=>!x.includes(p));
    if(x.reduce((v,p)=>v+G.sc[j][p],0)!==y.reduce((v,p)=>v+G.sc[j][p],0))break;
    mult++;
  }
  let losers=sa<sb?b:a;
  return [0,1,2,3].map(p=>losers.includes(p)?G.teamFee*mult:0);
}
function drawTeam(){
  if(G.sc[G.cur].some(v=>v===null)){alert('4명의 점수를 모두 입력한 뒤 팀을 뽑아 주세요.');return;}
  if(G.draws[G.cur]&&!confirm('이 홀의 팀을 다시 뽑으면 정산이 변경됩니다. 다시 뽑을까요?'))return;
  const pairs=[[0,1],[0,2],[0,3]];
  let arr=new Uint32Array(1);
  if(window.crypto?.getRandomValues)window.crypto.getRandomValues(arr);
  else arr[0]=Math.floor(Math.random()*4294967296);
  G.draws[G.cur]={a:pairs[arr[0]%3]};
  for(let j=G.cur+1;j<G.h;j++)G.draws[j]=null;
  renderHole();saveState();
}

    let sa=a.reduce((v,p)=>v+row[p],0),sb=b.reduce((v,p)=>v+row[p],0);

      +(sa===sb?'<br><b>다음 홀 배율 증가</b>':'')+'</div>';
  }else h+='<div class="ibox" style="margin-top:8px;">4명 점수 입력 후 팀 뽑기를 눌러 승패를 확정하세요.</div>';
  el.innerHTML=h;

function distribute4(weights,total){
  let units=total/1000,cap=30;
  if(!Number.isInteger(units)||units>120)return null;
  let w=weights.map(v=>Math.max(0,v));if(w.every(v=>v===0))w=[1,1,1,1];
  let result=[0,0,0,0];
  for(let n=0;n<units;n++){
    let eligible=[0,1,2,3].filter(i=>result[i]<cap);
    if(!eligible.length)return null;
    let sum=eligible.reduce((v,i)=>v+w[i],0);
    let best=eligible[0];
    if(sum>0){best=eligible.reduce((a,b)=>w[b]/sum-result[b]/(n+1)>w[a]/sum-result[a]/(n+1)?b:a);}
    else best=eligible.reduce((a,b)=>result[b]<result[a]?b:a);
    result[best]++;
  }
  return result.map(v=>v*1000);
}

/* ── 성적 보너스 ── */
function calcScoreBonus(){
  // 성적 보너스만 (버디/이글/트리플)
  let bn=Array(G.mode).fill(0);
  for(let i=0;i<G.h;i++){
    for(let p=0;p<G.mode;p++){
      let v=G.sc[i][p];
      if(v===null) continue;
      if(G.mode===4){if(v===-1)bn[p]-=1000;else if(v<=-2)bn[p]-=3000;continue;}
      if(v===-1) bn[p]-=G.u;
      else if(v<=-2) bn[p]-=G.u*2;
      else if(v>=3) bn[p]+=G.u;
    }
  }
  return bn;
}
function calcMgBonus(){
  // 플레이어별 누적 멀리건: 0~1회 무료, 2회 +1,000원, 3회 +2,000원
  let mg=Array(G.mode).fill(0);
  if(!G.useMulligan) return mg;
  for(let p=0;p<G.mode;p++){
    let total=Number(G.mg?.[p])||0;
    if(total>=2) mg[p]=(total-1)*G.u;
  }
  return mg;
}

function calcBonus(){
  // 성적+멀리건 합산
  let sb=calcScoreBonus(), mb=calcMgBonus();
  return sb.map((v,i)=>v+mb[i]);
}

/* ── 홀 기본금액 합산 ── */
function calcRaw(){
  let r=Array(G.mode).fill(0);
  for(let i=0;i<G.h;i++){
    let amt=holeAmounts(G.sc[i]);
    if(!amt) continue;
    for(let p=0;p<G.mode;p++) r[p]+=amt[p];
  }
  return r;
}

/* ── 총타수 계산 ── */
function totalScores(){
  return Array.from({length:G.mode},(_,p)=>{
    let s=0;
    for(let i=0;i<G.h;i++) if(G.sc[i][p]!==null) s+=G.sc[i][p];
    return s;
  });
}

/* ── 최종 게임비 배분 ── */
function calcFinal(){
  let raw=calcRaw(), bn=calcBonus();
  let x1=raw.map((r,i)=>r+bn[i]);
  let tot=G.gf*G.mode;

  // 기본 배분
  let x2, k=null, note='normal';
  if(x1.every(v=>v<=0)){
    x2=Array(G.mode).fill(r1k(tot/G.mode)); note='even';
  } else {
    let pos=x1.map(v=>Math.max(0,v));
    let posSum=pos.reduce((a,b)=>a+b,0);
    if(x1.some(v=>v<=0)){
      x2=pos.map(v=>r1k(v/posSum*tot)); note='partial';
    } else {
      k=tot/posSum;
      x2=x1.map(v=>r1k(v*k));
    }
  }

  if(G.mode===4){
    let four=distribute4(x1,tot);
    x2=four||[0,0,0,0];
    note=four?'team4':'invalid';
  }

  // 3인 추가 조정
  let gasAdj=Array(G.mode).fill(0);
  let capAdj=Array(G.mode).fill(0);
  let roundAdj=Array(G.mode).fill(0);
  let gasIdx=-1;

  if(G.mode===3){
    // ① 기름값 보상
    if(G.gasFee>=0&&G.gasFee<3){
      gasIdx=G.gasFee;
      gasAdj[gasIdx]=-2000;
      for(let p=0;p<3;p++) if(p!==gasIdx) gasAdj[p]=1000;
    }

    // ② 기름값 반영 후 30,000원 상한 적용
    let tmp=x2.map((v,i)=>v+gasAdj[i]);
    let CAP=30000;
    let overIdx=tmp.findIndex(v=>v>CAP);
    if(overIdx>=0){
      let over=tmp[overIdx]-CAP;
      capAdj[overIdx]=-(tmp[overIdx]-CAP);
      let others=[0,1,2].filter(p=>p!==overIdx);
      let ts=totalScores();
      let sorted=others.map(p=>({p,s:ts[p]})).sort((a,b)=>b.s-a.s);
      let chunks=Math.round(over/1000);
      for(let c=0;c<chunks;c++) capAdj[sorted[c%2].p]+=1000;
    }

    // ③ 최종 반영
    x2=x2.map((v,i)=>v+gasAdj[i]+capAdj[i]);

    // ④ 반올림 오차 보정
    let sum3=x2.reduce((a,b)=>a+b,0);
    let diff=sum3-(G.gf*3);
    if(diff===1000){
      let minIdx=x2.indexOf(Math.min(...x2));
      roundAdj[minIdx]=-1000;
    } else if(diff===-1000){
      let maxIdx=x2.indexOf(Math.max(...x2));
      roundAdj[maxIdx]=1000;
    }
    x2=x2.map((v,i)=>v+roundAdj[i]);
  }

  // 2인 반올림 오차 보정
  if(G.mode===2){
    let sum2=x2.reduce((a,b)=>a+b,0);
    let diff2=sum2-(G.gf*2);
    if(diff2===1000){
      // 합계 초과(31000) → 이긴 사람(적게 낸 사람) 1000원 차감
      let minIdx=x2.indexOf(Math.min(...x2));
      roundAdj[minIdx]=-1000;
    } else if(diff2===-1000){
      // 합계 부족(29000) → 진 사람(많이 낸 사람) 1000원 추가
      let maxIdx=x2.indexOf(Math.max(...x2));
      roundAdj[maxIdx]=1000;
    }
    x2=x2.map((v,i)=>v+roundAdj[i]);
  }

  return {raw,bn,x1,x2,k,note,gasAdj,capAdj,gasIdx,roundAdj};
}

/* ── 예상 정산 ── */
function calcEst(){
  let played=G.mode===4?G.draws.filter(Boolean).length:G.sc.filter(s=>s.every(v=>v!==null)).length;
  if(played===0) return null;
  return calcFinal().x2;
}

function rankBadge(rank){
  if(rank===0) return '<span class="rank1">1등</span>';
  if(rank===1) return '<span class="rank2">2등</span>';
  return '<span class="rank3">3등</span>';
}
// amt 배열로 실제 등수 배열 계산 (동타 처리 포함)
function getRanks(amt){
  if(!amt) return null;
  let unique=[...new Set(amt)].sort((a,b)=>a-b);
  return amt.map(v=>unique.indexOf(v));
}

function renderVerd(){
  let row=G.sc[G.cur];
  let el=document.getElementById('verd');
  if(row.some(v=>v===null)||(G.mode===4&&!G.draws?.[G.cur])){el.innerHTML='';return;}
  if(G.mode===4){let amt=holeAmounts(row);el.innerHTML='<span class="badge bd">'+(amt.every(v=>v===0)?'동점 · 다음 홀 배율 증가':'패배팀 각 '+Math.max(...amt).toLocaleString()+'원')+'</span>';return;}
  let amt=holeAmounts(row);
  let h='';
  if(G.mode===2){
    if(amt[0]===amt[1]) h='<span class="badge bd">비김 · 각 '+G.u.toLocaleString()+'원</span>';
    else{
      let w=amt[0]===0?0:1,l=1-w;
      h='<span class="badge bw">'+G.nm[w]+' 승</span><span class="badge b3">'+G.nm[l]+' '+G.u.toLocaleString()+'원</span>';
    }
  } else {
    let ranks=getRanks(amt);
    for(let p=0;p<3;p++){
      let rank=ranks[p];
      let bc=rank===0?'bw':rank===1?'b2':'b3';
      let label=rank===0?'1등':rank===1?'2등 '+G.u.toLocaleString()+'원':'3등 '+(G.u*2).toLocaleString()+'원';
      h+='<span class="badge '+bc+'">'+G.nm[p]+' '+label+'</span>';
    }
  }
  el.innerHTML=h;
}

function renderST(){
  let sum=Array(G.mode).fill(0),has=Array(G.mode).fill(false);
  for(let i=0;i<G.h;i++){
    for(let p=0;p<G.mode;p++){
      if(G.sc[i][p]!==null){sum[p]+=G.sc[i][p];has[p]=true;}
    }
  }
  let h='<table class="score-table"><thead><tr><th>홀</th>';
  for(let p=0;p<G.mode;p++) h+='<th>'+G.nm[p]+'</th>';
  h+=(G.mode===3?'<th>순위</th>':'<th>결과</th>')+'</tr></thead><tbody>';

  h+='<tr class="sum-row"><td>합계</td>';
  for(let p=0;p<G.mode;p++){
    let d=has[p]?dv(sum[p]):'—', c=has[p]?sc(sum[p]):'#94a3b8';
    h+='<td><span style="font-size:13px;color:'+c+';">'+d+'</span></td>';
  }
  h+='<td></td></tr>';

  for(let i=0;i<G.h;i++){
    let row=G.sc[i], ic=i===G.cur;
    let amt=holeAmounts(row);
    h+='<tr'+(ic?' class="cur-row"':'')+'>'
      +'<td style="color:'+(ic?'#1e293b':'#64748b')+';font-weight:'+(ic?'700':'400')+';">'+(ic?'▶ ':'')+(i+1)+'</td>';
    for(let p=0;p<G.mode;p++){
      let v=row[p];
      let teamBorder='';
      if(G.mode===4&&v!==null&&G.draws?.[i]&&row.every(x=>x!==null)){
        let a=G.draws[i].a,b=[0,1,2,3].filter(x=>!a.includes(x));
        let sa=a.reduce((t,x)=>t+row[x],0),sb=b.reduce((t,x)=>t+row[x],0);
        teamBorder=sa===sb?' team-tie-score':(a.includes(p)===(sa<sb)?' team-win-score':' team-lose-score');
      }
      h+='<td>'+(v===null?'<span style="color:#94a3b8;">—</span>':'<span class="sc-chip '+cc(v)+teamBorder+'">'+dv(v)+'</span>')+'</td>';
    }
    let rc='';
    if(amt){
      if(G.mode===4){rc=G.draws?.[i]?(amt.every(v=>v===0)?'동점':'승/패'):'';}
      else if(G.mode===2){
        let w=amt[0]===0?0:1;
        rc=amt[0]===amt[1]?'<span style="font-size:11px;color:#888;">무</span>':'<span style="font-size:11px;font-weight:600;color:#27500A;">'+G.nm[w][0]+'승</span>';
      } else {
        let ranks=getRanks(amt);
        for(let p=0;p<3;p++) rc+=rankBadge(ranks[p]);
      }
    }
    h+='<td>'+rc+'</td></tr>';
  }
  h+='</tbody></table>';
  document.getElementById('scoretable').innerHTML=h;
}

function cycleMulligan(p){
  if(!Array.isArray(G.mg)||G.mg.length!==G.mode) G.mg=Array(G.mode).fill(0);
  G.mg[p]=((Number(G.mg[p])||0)+1)%4;
  renderHole();
  saveState();
}

function setSc(p,v){if(G.mode===4&&G.draws?.[G.cur]){G.draws[G.cur]=null;for(let i=G.cur+1;i<G.h;i++)G.draws[i]=null;}G.sc[G.cur][p]=v;renderHole();saveState();}
function renderHole(){
  document.getElementById('htitle').textContent='홀 '+(G.cur+1)+' / '+G.h;
  renderInputs();renderTeamDraw();renderSD();renderVerd();renderST();renderRun();
}

function renderRun(){
  let raw=calcRaw(), sb=calcScoreBonus(), mb=calcMgBonus();
  let bn=sb.map((v,i)=>v+mb[i]);
  let played=G.mode===4?G.draws.filter(Boolean).length:G.sc.filter(s=>s.every(v=>v!==null)).length;
  let x1=raw.map((r,i)=>r+bn[i]);
  let est=calcEst();
  let h='<div style="font-size:12px;color:#64748b;margin-bottom:10px;">'+played+'홀 완료 · 남은 '+(G.h-played)+'홀</div>';
  for(let i=0;i<G.mode;i++){
    let col=x1[i]>0?'#27500A':x1[i]<0?'#A32D2D':'#64748b';
    let estStr=est?'−'+est[i].toLocaleString()+'원':'—';
    let gasTag=(G.mode===3&&G.gasFee===i)
      ?'<span style="font-size:11px;background:var(--blue-bg);color:var(--blue-txt);border-radius:99px;padding:1px 7px;margin-left:5px;vertical-align:middle;">⛽기름값</span>'
      :'';
    // 멀리건 누적 태그 (이름 옆)
    let mgTag='';
    let totalMg=Number(G.mg?.[i])||0;
    if(G.useMulligan&&totalMg>0){
      let mgCol=mb[i]>0?'#A32D2D':'#854F0B';
      let mgBg=mb[i]>0?'#FCEBEB':'var(--amber-bg)';
      mgTag='<span style="font-size:11px;background:'+mgBg+';color:'+mgCol+';border-radius:99px;padding:1px 7px;margin-left:5px;vertical-align:middle;">🔄'+totalMg+'회'+(mb[i]>0?' +'+mb[i].toLocaleString()+'원':'')+'</span>';
    }
    // 기본/성적/멀리건 분리 표시
    let subParts='기본 '+raw[i].toLocaleString();
    subParts+=' / 성적 '+(sb[i]>=0?'+':'')+sb[i].toLocaleString();
    if(G.useMulligan&&mb[i]>0) subParts+=' / 멀리건 +'+mb[i].toLocaleString();
    h+='<div class="rrow">'
      +'<div><div style="font-size:15px;font-weight:600;">'+G.nm[i]+gasTag+mgTag+'</div>'
      +'<div style="font-size:11px;color:#94a3b8;margin-top:2px;">'+subParts+'</div></div>'
      +'<div style="text-align:right;">'
        +'<div style="font-size:13px;color:'+col+';font-weight:600;">비용지수 '+x1[i].toLocaleString()+'</div>'
        +'<div style="font-size:16px;font-weight:700;color:#A32D2D;margin-top:2px;">'+estStr+'</div>'
        +'<div style="font-size:10px;color:#94a3b8;margin-top:1px;">현재 기준 예상 정산</div>'
      +'</div></div>';
  }
  if(est){
    h+='<div style="margin-top:8px;padding:8px 10px;background:#f0f7ff;border-radius:6px;font-size:12px;color:#185FA5;">'
      +'예상 합계 '+est.reduce((a,b)=>a+b,0).toLocaleString()+'원 · 인당 게임비 '+G.gf.toLocaleString()+'원 기준</div>';
  }
  document.getElementById('rtotal').innerHTML=h;
}

function prevH(){if(G.cur>0){G.cur--;renderHole();saveState();}}
function nextH(){if(G.cur<G.h-1){G.cur++;renderHole();saveState();}}

function renderResult(){
  let {raw,bn,x1,x2,k,note,gasAdj,capAdj,gasIdx,roundAdj}=calcFinal();
  let sgrid=document.getElementById('scards');
  sgrid.className='sgrid '+(G.mode===2||G.mode===4?'sgrid-2':'sgrid-3');
  sgrid.innerHTML=G.nm.slice(0,G.mode).map((nm,i)=>
    '<div class="met"><div class="mlabel">'+nm+'</div>'
    +'<div class="mval" style="color:#A32D2D;">−'+x2[i].toLocaleString()+'원</div>'
    +'<div class="msub">게임비 부담액</div></div>').join('');

  let ch='';
  // 1단계
  ch+='<div class="cstep"><div class="cstep-title">1단계 · 홀 기본금액 합산</div>';
  if(G.mode===4)ch+='<div style="font-size:11px;color:#64748b;">매 홀 추첨 팀전 · 동점 시 배율 이월 · 패배팀 각 홀별 설정액 × 배율</div>';
  if(G.mode===3) ch+='<div style="font-size:11px;color:#94a3b8;margin-bottom:5px;">1등 0원 / 2등 '+G.u.toLocaleString()+'원 / 3등 '+(G.u*2).toLocaleString()+'원 (동순위 적용)</div>';
  for(let i=0;i<G.mode;i++) ch+='<div class="crow"><span>'+G.nm[i]+'</span><span>'+raw[i].toLocaleString()+'원</span></div>';
  ch+='</div>';

  // 2단계
  ch+='<div class="cstep"><div class="cstep-title">2단계 · 성적 보너스/패널티</div>';
  for(let i=0;i<G.mode;i++){
    let parts=[],bc=0,ec=0,tc=0;
    for(let j=0;j<G.h;j++){
      let v=G.sc[j][i];
      if(v===-1) bc++;
      else if(v!==null&&v<=-2) ec++;
      else if(v!==null&&v>=3) tc++;
    }
    if(bc>0) parts.push('버디 '+bc+'개 −'+(bc*G.u).toLocaleString()+'원');
    if(ec>0) parts.push('이글+ '+ec+'개 −'+(ec*(G.mode===4?3000:G.u*2)).toLocaleString()+'원');
    if(tc>0&&G.mode!==4) parts.push('트리플+ '+tc+'개 +'+(tc*G.u).toLocaleString()+'원');
    if(G.useMulligan){
      let count=Number(G.mg?.[i])||0;
      let mgCost=count>=2?(count-1)*G.u:0;
      if(count>0) parts.push('멀리건 '+count+'회'+(mgCost?' +'+mgCost.toLocaleString()+'원':' (무료)'));
    }
    ch+='<div class="crow"><span>'+G.nm[i]+'</span><span>'+(bn[i]>=0?'+':'')+bn[i].toLocaleString()+'원</span></div>';
    ch+='<div style="font-size:11px;color:#94a3b8;padding:0 0 3px;">'+(parts.length?parts.join(' / '):'없음')+'</div>';
  }
  for(let i=0;i<G.mode;i++) ch+='<div class="crow tot"><span>'+G.nm[i]+' 소계</span><span>'+x1[i].toLocaleString()+'원</span></div>';
  ch+='</div>';

  // 3단계
  ch+='<div class="cstep"><div class="cstep-title">3단계 · 전체 게임비 비율 배분 (천원 단위 반올림)</div>';
  ch+='<div class="crow"><span>목표 총액</span><span>'+(G.gf*G.mode).toLocaleString()+'원 (인당 '+G.gf.toLocaleString()+'원×'+G.mode+')</span></div>';
  if(note==='team4')ch+='<div class="crow"><span>4인 팀전</span><span>천원 단위 · 1인 30,000원 상한</span></div>';
  if(note==='normal'&&k) ch+='<div class="crow"><span>배율 k</span><span>'+k.toFixed(2)+'배</span></div>';
  if(note==='partial') ch+='<div class="crow" style="color:#A32D2D;"><span>일부 0 이하 → 양수 비율 배분</span><span></span></div>';
  if(note==='even') ch+='<div class="crow"><span>전원 0 이하 → 균등 배분</span><span></span></div>';
  let baseX2=x2.map((v,i)=>v-gasAdj[i]-capAdj[i]-roundAdj[i]);
  for(let i=0;i<G.mode;i++) ch+='<div class="crow tot"><span>'+G.nm[i]+' 배분액</span><span>'+baseX2[i].toLocaleString()+'원</span></div>';
  ch+='</div>';

  let step=4;
  // 4단계: 기름값
  if(G.mode===3&&gasIdx>=0){
    ch+='<div class="cstep"><div class="cstep-title">'+step+'단계 · 기름값 보상</div>';
    ch+='<div style="font-size:11px;color:#94a3b8;margin-bottom:5px;">'+G.nm[gasIdx]+' 선택 → −2,000원 / 나머지 각 +1,000원</div>';
    for(let i=0;i<3;i++){
      let a=gasAdj[i];
      ch+='<div class="crow"><span>'+G.nm[i]+'</span><span style="color:'+(a<0?'#27500A':a>0?'#A32D2D':'#888')+'">'+(a>0?'+':'')+a.toLocaleString()+'원</span></div>';
    }
    ch+='</div>';
    step++;
  }

  // 상한 단계
  if(G.mode===3&&capAdj.some(v=>v!==0)){
    ch+='<div class="cstep"><div class="cstep-title">'+step+'단계 · 30,000원 상한 적용</div>';
    ch+='<div style="font-size:11px;color:#94a3b8;margin-bottom:5px;">초과분을 나머지 2명 중 타수 높은 순으로 부과</div>';
    for(let i=0;i<3;i++){
      let a=capAdj[i];
      if(a===0) continue;
      ch+='<div class="crow"><span>'+G.nm[i]+'</span><span style="color:'+(a<0?'#27500A':'#A32D2D')+'">'+(a>0?'+':'')+a.toLocaleString()+'원</span></div>';
    }
    ch+='</div>';
    step++;
  }

  // 반올림 보정 단계 (2인/3인 공통)
  if(roundAdj.some(v=>v!==0)){
    let prevSum=x2.map((v,i)=>v-roundAdj[i]).reduce((a,b)=>a+b,0);
    let diff=prevSum-(G.gf*G.mode);
    let stepLabel=G.mode===2?'4':step+'';
    ch+='<div class="cstep"><div class="cstep-title">'+stepLabel+'단계 · 합계 보정</div>';
    if(diff>0) ch+='<div style="font-size:11px;color:#94a3b8;margin-bottom:5px;">합계 '+prevSum.toLocaleString()+'원 → '+diff.toLocaleString()+'원 초과 · 이긴 사람 차감</div>';
    else ch+='<div style="font-size:11px;color:#94a3b8;margin-bottom:5px;">합계 '+prevSum.toLocaleString()+'원 → '+Math.abs(diff).toLocaleString()+'원 부족 · 진 사람 추가</div>';
    for(let i=0;i<G.mode;i++){
      let a=roundAdj[i];
      if(a===0) continue;
      ch+='<div class="crow"><span>'+G.nm[i]+'</span><span style="color:'+(a<0?'#27500A':'#A32D2D')+'">'+(a>0?'+':'')+a.toLocaleString()+'원</span></div>';
    }
    ch+='</div>';
  }

  // 최종
  ch+='<div class="cstep" style="background:var(--bg);border-radius:var(--radius-sm);padding:10px 12px;margin-top:4px;">';
  for(let i=0;i<G.mode;i++) ch+='<div class="crow tot"><span>'+G.nm[i]+' 최종</span><span style="color:#A32D2D;">−'+x2[i].toLocaleString()+'원</span></div>';
  ch+='</div>';
  document.getElementById('cbdown').innerHTML=ch;

  let bh='';
  for(let i=0;i<G.h;i++){
    let row=G.sc[i];
    if(row.some(v=>v===null)){bh+='<div class="hrow"><span style="color:#64748b;">홀 '+(i+1)+'</span><span style="color:#94a3b8;">미입력</span></div>';continue;}
    let amt=holeAmounts(row);
    let scores=G.nm.slice(0,G.mode).map((nm,p)=>nm[0]+':'+ls(row[p])).join(' ');
    let result='';
    if(G.mode===4){result='<span class="badge bd">'+(amt.every(v=>v===0)?'동점':'패배 '+Math.max(...amt).toLocaleString()+'원')+'</span>'; }
    else if(G.mode===2){
      let w=amt[0]===0?0:1;
      result=amt[0]===amt[1]?'<span class="badge bd">무</span>':'<span class="badge bw">'+G.nm[w]+'</span>';
    } else {
      let ranks=getRanks(amt);
      for(let p=0;p<3;p++) result+=rankBadge(ranks[p]);
    }
    bh+='<div class="hrow"><span style="color:#64748b;font-size:12px;">홀 '+(i+1)+'</span>'
      +'<span style="color:#64748b;font-size:11px;">'+scores+'</span>'+result+'</div>';
  }
  document.getElementById('hbdown').innerHTML=bh;
}

/* ── localStorage ── */
function saveState(page){
  try{
    localStorage.setItem('golf_state',JSON.stringify({G,page:page||currentPage()}));
  }catch(e){}
}
function currentPage(){
  for(let p of['pg-setup','pg-score','pg-result']){
    if(document.getElementById(p).classList.contains('active')) return p;
  }
  return 'pg-setup';
}
function loadState(){
  try{
    let raw=localStorage.getItem('golf_state');
    if(!raw) return false;
    let saved=JSON.parse(raw);
    if(!saved||!saved.G) return false;
    G=saved.G;
    if(G.gasFee===undefined) G.gasFee=-1;
    if(!Array.isArray(G.nm))G.nm=[];
    G.nm[3]=G.nm[3]||'플레이어4';
    G.teamFee=Number(G.teamFee)||1000;
    if(!Array.isArray(G.draws)||G.draws.length!==G.h)G.draws=Array(G.h).fill(null);
    if(G.useMulligan===undefined) G.useMulligan=false;
    // 기존 홀별 저장 데이터를 플레이어별 누적 횟수로 이전
    if(Array.isArray(G.mg)&&Array.isArray(G.mg[0])){
      let old=G.mg;
      G.mg=Array.from({length:G.mode},(_,p)=>Math.min(3,old.reduce((sum,row)=>sum+(Number(row?.[p])||0),0)));
    } else {
      G.mg=Array.from({length:G.mode},(_,p)=>Math.max(0,Math.min(3,Number(G.mg?.[p])||0)));
    }
    let restoredGas=G.gasFee;
    setMode(G.mode);
    G.gasFee=restoredGas;
    document.getElementById('p1name').value=G.nm[0];
    document.getElementById('p2name').value=G.nm[1];
    document.getElementById('p3name').value=G.nm[2]||'이태석';
    document.getElementById('p4name').value=G.nm[3];
    document.getElementById('teamfee').value=G.teamFee;
    document.getElementById('gf').value=G.gf;
    updateGasUI();
    updI();
    let mb=document.getElementById('mulligan-toggle');
    if(mb){mb.textContent=G.useMulligan?'ON':'OFF';mb.style.background=G.useMulligan?'var(--blue)':'#94a3b8';}
    if(saved.page==='pg-score'){
      document.getElementById('topbar-sub').textContent=G.nm.slice(0,G.mode).join(' · ');
      showP('pg-score');renderHole();
    } else if(saved.page==='pg-result'){
      document.getElementById('topbar-sub').textContent=G.nm.slice(0,G.mode).join(' · ');
      renderResult();showP('pg-result');
    }
    return true;
  }catch(e){return false;}
}
function clearState(){try{localStorage.removeItem('golf_state');}catch(e){}}

/* ── 앱 시작 ── */
if(!loadState()){initSc();updI();}
</script>
</body>
